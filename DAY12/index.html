<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Filter In Array</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #searchContainer {
            display: flex;
            gap: 10px;
        }

        #searchInput {
            padding: 10px;
            font-size: 16px;
            width: 200px;
        }

        #searchButton {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        #resultsContainer {
            margin-top: 20px;
        }

        #result {
            font-size: 18px;
            color: #333;
        }
    </style>
</head>
<body>
    <div>

        <div id="searchContainer">
            <input type="text" id="searchInput" placeholder="Search...">
            <button id="searchButton">Search</button>

        </div>
        <div id="resultsContainer">
            <p id="result"></p>


        </div>

    





        <script src="script.js"></script>

    </div>
</body>
</html>
