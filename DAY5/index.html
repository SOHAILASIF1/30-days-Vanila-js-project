<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div>
        <input type="Number" placeholder="number 1" name="" id="num1">
        <input type="number" placeholder="number 2" name="" id="num2">
        <div id="button">
            <button id="add">Add</button>
            <button id="subt">Subtract</button>
            <button id="multiply">Multiply</button>
            <button id="divide">Divide</button>
        </div>
        <p id="result">The result is : <span id="span"></span></p>

    </div>






    <script src="script.js"></script>
    
</body>
</html>
